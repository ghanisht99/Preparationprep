<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Placement Prep Portal</title>

    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/png" href="graduation.png">
</head>

<body>

    <!------ REGISTER PAGE ------->

    <div class="register-container">
        <h1>Create Account</h1><br>

        <p>Join preparartion Prep portal and starts your <br>
            journey towards a better future.
        </p>
        <br>
           
        <div class="register-form">
            <label>Full Name</label>
            <input type="Full Name" placeholder="Enter your full name">
        </div>

        <div class="register-form">
            <label>Email Address</label>
            <input type="Email Address" placeholder="Enter your email address">
        </div>
        
        <div class="register-form">
            <label>Password</label>
            <input type="Password" placeholder="Enter password">
        </div>

        <div class="register-form">
            <label>Confirm password</label><br>
            <input type="Confirm passowrd" placeholder="Re-Enter your password">
        </div>

        <button class="create-button"  >Create Account</button>
        

        <div class="or-divider1">
            <span>OR</span>
        </div>

         <p>Already have an account?
            <a href="login.html">Login</a>
         </p>
        
        

    </div>
    </body>
    </html>
